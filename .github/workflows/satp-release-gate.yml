name: SATP Release Gate

on:
  pull_request:
    paths:
      - ".github/workflows/satp-release-gate.yml"
      - "README.md"
      - "docs/package-boundary.md"
      - "docs/satp-client-consumer-install.md"
      - "package.json"
      - "package-lock.json"
      - "packages/satp*/**"
      - "scripts/check-exports.js"
      - "scripts/check-satp-client-package-health.js"
      - "scripts/check-satp-client-uuid-advisory.js"
      - "scripts/check-satp-release-metadata.js"
      - "scripts/smoke-clean-consumer-install.js"
      - "scripts/validate-idls.py"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/satp-release-gate.yml"
      - "README.md"
      - "docs/package-boundary.md"
      - "docs/satp-client-consumer-install.md"
      - "package.json"
      - "package-lock.json"
      - "packages/satp*/**"
      - "scripts/check-exports.js"
      - "scripts/check-satp-client-package-health.js"
      - "scripts/check-satp-client-uuid-advisory.js"
      - "scripts/check-satp-release-metadata.js"
      - "scripts/smoke-clean-consumer-install.js"
      - "scripts/validate-idls.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SATP CI
        run: npm run ci

      - name: Run package health and secret-shape checks
        run: npm run check:satp-client-health

      - name: Run RC-S6 conformance fixtures
        run: npm run test:conformance:rc-s6

      - name: Pack SATP client
        run: npm run pack:satp-client
