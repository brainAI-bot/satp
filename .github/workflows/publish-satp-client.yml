name: Publish SATP client 2.0.8

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-satp-client-2.0.8
  cancel-in-progress: false

env:
  SATP_CLIENT_RELEASE_SOURCE: 25aa48ca646f628e186692e567d048d1027ba7df
  SATP_CLIENT_RELEASE_TREE: cd8ed9518287553986baf5eb64f8a367c0e48d2f

jobs:
  publish:
    name: Publish @brainai/satp-client@2.0.8
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the immutable 2.0.8 release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SATP_CLIENT_RELEASE_SOURCE }}

      - name: Verify the reviewed 2.0.8 release tree
        shell: bash
        run: |
          set -euo pipefail
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$actual_tree" != "$SATP_CLIENT_RELEASE_TREE" ]]; then
            echo "release tree mismatch: expected $SATP_CLIENT_RELEASE_TREE, got $actual_tree" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Trusted Publishing-capable npm
        run: npm install --global npm@11.5.2

      - name: Verify fixed release version
        run: test "$(node -p "require('./packages/satp-client/package.json').version")" = "2.0.8"

      - name: Refuse to overwrite an existing release
        run: |
          if npm view @brainai/satp-client@2.0.8 version >/dev/null 2>&1; then
            echo "@brainai/satp-client@2.0.8 already exists; refusing to publish"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify the publish artifact
        run: npm run check:satp-client-health

      - name: List the tarball before publish
        run: npm pack ./packages/satp-client --dry-run

      - name: Verify npm latest is still the approved baseline
        shell: bash
        run: |
          set -euo pipefail
          tags="$(npm view @brainai/satp-client dist-tags --json)"
          node -e '
            const tags = JSON.parse(process.argv[1]);
            if (tags.latest !== "2.0.7" || tags.rc !== "2.0.2") {
              throw new Error(
                `refusing publish: expected latest=2.0.7 and rc=2.0.2, got latest=${String(tags.latest)} and rc=${String(tags.rc)}`,
              );
            }
          ' "$tags"

      - name: Publish clean replacement with npm Trusted Publishing
        run: npm publish ./packages/satp-client --access public --provenance

      - name: Verify npm dist-tags after publish
        shell: bash
        run: |
          set -euo pipefail
          tags="$(npm view @brainai/satp-client dist-tags --json)"
          node -e '
            const tags = JSON.parse(process.argv[1]);
            if (tags.latest !== "2.0.8" || tags.rc !== "2.0.2") {
              throw new Error(
                `unexpected post-publish dist-tags: expected latest=2.0.8 and rc=2.0.2, got latest=${String(tags.latest)} and rc=${String(tags.rc)}`,
              );
            }
          ' "$tags"
