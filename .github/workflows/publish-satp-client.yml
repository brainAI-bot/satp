name: Publish SATP client 2.0.7

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-satp-client-2.0.7
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @brainai/satp-client@2.0.7
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install Trusted Publishing-capable npm
        run: npm install --global npm@11.5.2

      - name: Verify fixed release version
        run: test "$(node -p "require('./packages/satp-client/package.json').version")" = "2.0.7"

      - name: Refuse to overwrite an existing release
        run: |
          if npm view @brainai/satp-client@2.0.7 version >/dev/null 2>&1; then
            echo "@brainai/satp-client@2.0.7 already exists; refusing to publish"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify the publish artifact
        run: npm run check:satp-client-health

      - name: Publish to the rc channel with npm Trusted Publishing
        run: npm publish ./packages/satp-client --access public --provenance --tag rc
