name: Prepare SATP client release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already committed on the selected source
        required: true
        type: string
      commit:
        description: Full commit SHA to prepare; it must be an ancestor of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-satp-client-${{ inputs.version }}-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare @brainai/satp-client@${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out requested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require an immutable main-ancestor commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full lowercase SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${{ inputs.commit }}" ]]; then
            echo "checked out $actual instead of requested commit ${{ inputs.commit }}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual" origin/main; then
            echo "requested commit $actual is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Require requested package version
        run: test "$(node -p "require('./packages/satp-client/package.json').version")" = "${{ inputs.version }}"

      - name: Record dry-run package file list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack ./packages/satp-client --dry-run --json > dist/satp-client-pack-dry-run.json

      - name: Verify exports, fee routing, and record gitHead
        run: >-
          node scripts/verify-satp-client-release-prep.js
          --pack-json dist/satp-client-pack-dry-run.json
          --version "${{ inputs.version }}"
          --git-head "${{ inputs.commit }}"
          --output dist/satp-client-release-prep.json

      - name: Install packed tarball in a clean consumer
        run: npm run smoke:satp-client-packed-consumer

      - name: Upload preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: satp-client-${{ inputs.version }}-release-prep
          path: |
            dist/satp-client-pack-dry-run.json
            dist/satp-client-release-prep.json
          if-no-files-found: error
