name: Escrow V3 Build Proof

on:
  pull_request:
    paths:
      - ".github/workflows/escrow-v3-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/escrow_v3/**"
      - "docs/escrow-v3-build-proof.md"
      - "docs/escrow-v3-build-proof-reference.json"
      - "scripts/verify-escrow-v3-build-proof.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/escrow-v3-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/escrow_v3/**"
      - "docs/escrow-v3-build-proof.md"
      - "docs/escrow-v3-build-proof-reference.json"
      - "scripts/verify-escrow-v3-build-proof.mjs"

permissions:
  contents: read

env:
  SOLANA_VERSION: "2.1.21"
  SBF_TOOLS_VERSION: "v1.52"

jobs:
  escrow-v3-build-proof:
    name: Escrow V3 build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86.0"
          components: rustfmt, clippy
          cache: false

      - name: Cache Cargo registry and git indexes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-indexes-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify pinned build toolchain
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          solana --version
          cargo build-sbf --version
          sdk_install="$HOME/.local/share/solana/install/active_release/bin/sdk/sbf/scripts/install.sh"
          resolved_before="$(awk '/# Install platform tools/{seen=1; next} seen && /^version=/{sub(/^version=/, ""); print; exit}' "$sdk_install")"
          echo "declared SBF_TOOLS_VERSION=${SBF_TOOLS_VERSION}"
          echo "resolved SDK platform-tools version before override=${resolved_before}"
          if [ "$resolved_before" != "$SBF_TOOLS_VERSION" ]; then
            perl -0pi -e "s/(# Install platform tools\\nversion=)v[0-9.]+/\${1}${SBF_TOOLS_VERSION}/" "$sdk_install"
          fi
          resolved_after="$(awk '/# Install platform tools/{seen=1; next} seen && /^version=/{sub(/^version=/, ""); print; exit}' "$sdk_install")"
          echo "resolved SDK platform-tools version after override=${resolved_after}"
          test "$resolved_after" = "$SBF_TOOLS_VERSION"

      - name: Prepare Solana platform-tools cache
        run: mkdir -p "$HOME/.cache/solana"

      - name: Build escrow_v3 program with pinned SBF toolchain
        run: |
          set -euo pipefail
          cargo clean --manifest-path programs/escrow_v3/Cargo.toml
          cargo build-sbf --force-tools-install --tools-version "${SBF_TOOLS_VERSION}" --manifest-path programs/escrow_v3/Cargo.toml 2>&1 | tee build-sbf.log
          echo "fresh escrow_v3 artifact sha256:"
          shasum -a 256 target/deploy/escrow_v3.so

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify escrow_v3 source-to-chain build proof
        env:
          BUILD_SBF_LOG: build-sbf.log
        run: node scripts/verify-escrow-v3-build-proof.mjs
