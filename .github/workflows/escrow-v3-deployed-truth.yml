name: Escrow V3 Deployed Truth

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/escrow-v3-deployed-truth.yml"
      - "Cargo.lock"
      - "programs/escrow_v3/**"
      - "docs/escrow-v3-deployed-truth.json"
      - "docs/fixtures/escrow-v3-canonical-idl.json"
      - "docs/escrow-v3-mainnet-rider-packet.md"
      - "idls/v3/escrow_v3.json"
      - "scripts/build-verify-escrow-v3-deployed-source.sh"
      - "scripts/verify-escrow-v3-deployed-truth.mjs"
      - "tests/escrow-v3-deployed-truth.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/escrow-v3-deployed-truth.yml"
      - "Cargo.lock"
      - "programs/escrow_v3/**"
      - "docs/escrow-v3-deployed-truth.json"
      - "docs/fixtures/escrow-v3-canonical-idl.json"
      - "docs/escrow-v3-mainnet-rider-packet.md"
      - "idls/v3/escrow_v3.json"
      - "scripts/build-verify-escrow-v3-deployed-source.sh"
      - "scripts/verify-escrow-v3-deployed-truth.mjs"
      - "tests/escrow-v3-deployed-truth.test.mjs"

permissions:
  contents: read

jobs:
  deployed-source-proof:
    name: Rebuild and compare deployed escrow source
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust 1.86.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86.0"
          cache: false

      - name: Install Solana CLI 2.1.21
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Rebuild recorded source and compare live ProgramData
        run: |
          mkdir -p target/deployed-truth
          scripts/build-verify-escrow-v3-deployed-source.sh \
            | tee target/deployed-truth/proof.json

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: escrow-v3-deployed-truth-${{ github.sha }}
          path: |
            target/deployed-truth/escrow_v3.so
            target/deployed-truth/proof.json
            docs/escrow-v3-deployed-truth.json
            docs/fixtures/escrow-v3-canonical-idl.json
            idls/v3/escrow_v3.json
          if-no-files-found: error
          retention-days: 90
