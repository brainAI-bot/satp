name: SATP Escrow Build Proof

on:
  pull_request:
    paths:
      - ".github/workflows/satp-escrow-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/satp_escrow/**"
      - "idls/satp_escrow.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/satp-escrow-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/satp_escrow/**"
      - "idls/satp_escrow.json"

permissions:
  contents: read

env:
  ANCHOR_VERSION: "0.31.1"
  SOLANA_VERSION: "2.1.21"

jobs:
  escrow-build-proof:
    name: Escrow build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86.0"
          components: rustfmt, clippy

      - name: Cache Cargo registry and git indexes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-indexes-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install Solana CLI and SBF tooling
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 0.31.1
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Verify pinned build toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          cargo build-sbf --version
          anchor --version

      - name: Build SATP escrow program
        run: anchor build --program-name satp_escrow

      - name: Emit SATP escrow artifact hash
        run: |
          test -f target/deploy/satp_escrow.so
          sha256sum target/deploy/satp_escrow.so
