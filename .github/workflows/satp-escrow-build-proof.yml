name: SATP Escrow Build Proof

on:
  pull_request:
    paths:
      - ".github/workflows/satp-escrow-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/satp_escrow/**"
      - "idls/satp_escrow.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/satp-escrow-build-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/satp_escrow/**"
      - "idls/satp_escrow.json"

permissions:
  contents: read

env:
  ANCHOR_VERSION: "0.31.1"
  SOLANA_VERSION: "2.1.21"

jobs:
  escrow-build-proof:
    name: Escrow build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86.0"
          components: rustfmt, clippy

      - name: Cache Cargo registry and git indexes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-indexes-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install Solana CLI and SBF tooling
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 0.31.1
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Verify pinned build toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          cargo build-sbf --version
          anchor --version

      - name: Pin Anchor.toml for legacy escrow build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'Anchor.toml';
          const input = fs.readFileSync(path, 'utf8');
          const output = input.replace(
            'anchor_version = "1.0.0"',
            'anchor_version = "0.31.1"',
          );
          if (output === input) {
            throw new Error('Anchor.toml toolchain version not found');
          }
          fs.writeFileSync(path, output);
          NODE
          grep 'anchor_version = "0.31.1"' Anchor.toml

      - name: Scope workspace to SATP escrow program
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('Cargo.toml', [
            '[workspace]',
            'members = [',
            '    "programs/satp_escrow"',
            ']',
            'resolver = "2"',
            '',
            '[profile.release]',
            'overflow-checks = true',
            'lto = "fat"',
            'codegen-units = 1',
            '',
            '[profile.release.build-override]',
            'opt-level = 3',
            'incremental = false',
            'codegen-units = 1',
            '',
          ].join('\n'));
          NODE

      - name: Pin legacy SBF-compatible lockfile entries
        run: |
          cargo update -p borsh:1.7.0 --precise 1.5.1
          cargo update -p proc-macro-crate:3.5.0 --precise 3.1.0
          cargo update -p indexmap --precise 2.7.1

      - name: Build SATP escrow program
        run: anchor build --program-name satp_escrow

      - name: Emit SATP escrow artifact hash
        run: |
          test -f target/deploy/satp_escrow.so
          sha256sum target/deploy/satp_escrow.so
