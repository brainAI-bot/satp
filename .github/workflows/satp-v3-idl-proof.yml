name: SATP V3 IDL Proof

on:
  pull_request:
    paths:
      - ".github/workflows/satp-v3-idl-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/*_v3/**"
      - "idls/v3/**"
      - "scripts/generate-v3-idls.mjs"
      - "scripts/validate-idls.py"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/satp-v3-idl-proof.yml"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "programs/*_v3/**"
      - "idls/v3/**"
      - "scripts/generate-v3-idls.mjs"
      - "scripts/validate-idls.py"
      - "package.json"

permissions:
  contents: read

jobs:
  validate-idls:
    name: Validate generated V3 IDLs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.89.0"
          rustflags: ""

      - name: Validate committed IDLs against source
        run: npm run validate:idls
