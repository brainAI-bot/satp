name: SATP Roadmap Lint

on:
  pull_request:
    paths:
      - "ROADMAP.md"
      - "docs/planning/ROADMAP.md"
      - "scripts/lint-roadmap.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/roadmap-lint.yml"
  push:
    branches:
      - main
    paths:
      - "ROADMAP.md"
      - "docs/planning/ROADMAP.md"
      - "scripts/lint-roadmap.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/roadmap-lint.yml"

permissions:
  contents: read

jobs:
  roadmap-lint:
    name: Roadmap lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run roadmap lint
        run: npm run lint:roadmap
