[package]
name = "escrow_v3"
version = "0.1.0"
description = "SATP V3 Escrow — Identity-verified on-chain escrow for agent transactions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow_v3"

[features]
default = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.0"
solana-hash = "4.2.0"
solana-sha256-hasher = "3.1.0"
