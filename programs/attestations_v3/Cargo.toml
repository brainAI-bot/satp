[package]
name = "attestations_v3"
version = "0.1.0"
description = "SATP Attestations V3 — agent_id-based attestations with CPI from Reviews"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
devnet = []
mainnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.0"
solana-hash = "4.2.0"
solana-sha256-hasher = "3.1.0"
